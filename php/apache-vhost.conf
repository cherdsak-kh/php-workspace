# 1. Default VirtualHost for localhost / 127.0.0.1
# Subfolder mode: http://localhost:PORT/<project-name>/
<VirtualHost *:80>
    ServerName localhost
    ServerAlias localhost 127.0.0.1
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options Indexes FollowSymLinks MultiViews
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>

# 2. Dynamic VirtualHost for *.localhost
# Root mode: http://<project-name>.localhost:PORT/ maps directly to /var/www/html/<project-name>/
<VirtualHost *:80>
    ServerAlias *.localhost
    VirtualDocumentRoot /var/www/html/%1

    <Directory /var/www/html>
        Options Indexes FollowSymLinks MultiViews
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
