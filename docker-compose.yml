services:
  php56:
    container_name: php56
    image: php-apache:5.6.40
    restart: "no"
    build:
      context: ./php
      dockerfile: Dockerfile-5.6
    extra_hosts:
      - "DB:${DB_HOST:-host-gateway}"
      - "hostname:${DB_HOST:-host-gateway}"
    volumes:
      - ./php/src:/var/www/html/
      - ./php/shim.php:/etc/php/shim.php:ro
    ports:
      - "${PHP56_PORT:-5640}:80"

