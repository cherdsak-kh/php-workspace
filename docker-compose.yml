  # =========================================================================
  # Container Management Web App (Portainer CE)
  # Manage, start/stop/restart containers, inspect logs, and access shells
  # Access: http://localhost:9000
  # =========================================================================
  portainer:
    container_name: portainer-hub
    image: portainer/portainer-ce:latest
    profiles: ["tools", "portainer"]
    restart: "no"
    ports:
      - "${PORTAINER_PORT:-9000}:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer-data:/data

  # =========================================================================
  # phpMyAdmin Database Management Tool
  # Connects directly to host's mysql-sv (MySQL 3306)
  # Access: http://localhost:8081
  # =========================================================================
  phpmyadmin:
    container_name: pma-hub
    image: phpmyadmin:latest
    profiles: ["tools", "pma"]
    restart: "no"
    extra_hosts:
      - "DB:${DB_HOST:-host-gateway}"
      - "mysql-sv:${DB_HOST:-host-gateway}"
    environment:
      PMA_HOST: DB
      PMA_PORT: 3306
      PMA_VERBOSE: "mysql-sv"
    ports:
      - "${PMA_PORT:-8081}:80"

  # =========================================================================
  # Optional Official MySQL 8.0 (Profile: mysql)
  # For clean machines without an existing mysql-sv on host.
  # Run: docker compose --profile mysql up -d mysql
  # Does NOT start automatically; zero conflict with host mysql-sv.
  # =========================================================================
  mysql:
    container_name: mysql-hub
    image: mysql:8.0
    profiles: ["mysql", "with-mysql"]
    restart: "no"
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-2024_web_template}
      MYSQL_USER: ${MYSQL_USER:-mysql_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-mysql_pws1598753}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      default:
        aliases:
          - DB
          - mysql-sv

volumes:
  mysql-data:
  portainer-data:
