services:
  php56:
    container_name: php56
    image: php-apache:5.6.40
    restart: unless-stopped
    build:
      context: ./php
      dockerfile: Dockerfile-5.6
    extra_hosts:
      - "DB:host-gateway"
      - "hostname:host-gateway"
    volumes:
      - ./php/src:/var/www/html/
      - ./php/shim.php:/etc/php/shim.php:ro
    ports:
      - "5640:80"

  php74:
    container_name: php74
    image: php-apache:7.4.33
